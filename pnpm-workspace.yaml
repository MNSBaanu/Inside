packages:
  - "apps/*"
  - "packages/*"

# Next.js type files import 'react' without declaring @types/react. Declaring it as an
# optional peer makes pnpm link the web app's React 18 types instead of whichever
# version happens to be hoisted (the mobile app uses React 19).
packageExtensions:
  next:
    peerDependencies:
      '@types/react': '*'
      '@types/react-dom': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
      '@types/react-dom':
        optional: true
