packages:
  - "apps/*"
  - "packages/*"

# These packages' type files import 'react' without declaring @types/react. Declaring it
# as an optional peer makes pnpm link the web app's own React types instead of whichever
# version happens to be hoisted.
packageExtensions:
  next:
    peerDependencies:
      '@types/react': '*'
      '@types/react-dom': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
      '@types/react-dom':
        optional: true
  lucide-react:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
