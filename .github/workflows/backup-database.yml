name: Backup database

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    name: Dump Neon
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Dump database
        run: |
          set -euo pipefail
          # pg_dump needs the direct (non-pooled) host and rejects Prisma-only URL options.
          url="${DATABASE_URL%%\?*}"
          export BACKUP_URL="${url/-pooler./.}?sslmode=require"
          file="inside-$(date -u +%Y-%m-%dT%H%MZ).dump"
          docker run --rm -e BACKUP_URL postgres:17 \
            sh -c 'pg_dump "$BACKUP_URL" --format=custom --no-owner --no-acl' > "$file"
          size=$(stat -c %s "$file")
          if [ "$size" -lt 1024 ]; then
            echo "::error::Backup is only $size bytes"
            exit 1
          fi
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"
          echo "Saved $file ($size bytes)"

      - name: Store backup
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
