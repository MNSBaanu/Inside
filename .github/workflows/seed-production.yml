name: Seed production database

on:
  push:
    branches: [main]
    paths:
      - 'packages/database/prisma/seed.ts'
      - 'packages/database/prisma/products.ts'
      - 'packages/database/prisma/migrations/**'
  workflow_dispatch:
    inputs:
      reset:
        description: Wipe all data first, then load the sample data
        type: boolean
        default: false
      confirm:
        description: To wipe, also type WIPE here
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  seed:
    name: Migrate and seed Neon
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SEED_MODE: ${{ inputs.reset && inputs.confirm == 'WIPE' && 'reset' || 'sync' }}
      DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
      DEMO_DESIGNER_EMAIL: ${{ secrets.DEMO_DESIGNER_EMAIL }}
      DEMO_CLIENT_EMAIL: ${{ secrets.DEMO_CLIENT_EMAIL }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @inside/database db:generate

      - name: Apply migrations
        run: pnpm --filter @inside/database exec prisma migrate deploy

      - name: Seed
        run: pnpm --filter @inside/database db:seed
