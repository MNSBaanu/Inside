name: Seed production database

on:
  push:
    branches: [main]
    paths:
      - 'packages/database/prisma/seed.ts'
      - 'packages/database/prisma/products.ts'
  workflow_dispatch:

concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  seed:
    name: Migrate and seed Neon
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @inside/database db:generate

      - name: Apply migrations
        run: pnpm --filter @inside/database exec prisma migrate deploy

      - name: Seed
        run: pnpm --filter @inside/database db:seed
